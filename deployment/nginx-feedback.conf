server {
    listen 80;
    listen [::]:80;
    server_name shibaura.amoebatronix.com;

    root /home/john/shibaura/feedback_management/public;
    index index.php index.html;

    charset utf-8;

    # Allow up to 100MB uploads (necessary for APK files and media attachments)
    client_max_body_size 100M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Primary Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static Assets & Caching (Vite build, images, fonts)
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # APK Downloads (Direct streaming)
    location ~* \.apk$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Content-Disposition "attachment";
    }

    # Disable Logging for Favicon & Robots
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Laravel 404 handler
    error_page 404 /index.php;

    # PHP-FPM Handler
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock; # Use php8.3-fpm.sock if using PHP 8.3
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Deny access to hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
